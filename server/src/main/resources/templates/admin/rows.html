<!doctype html>
<html th:replace="~{admin/fragments/shell :: shell(|${list.tableName} 목록|, ~{::main}, ${list.tableName})}" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>목록</title>
</head>
<body>
<main class="content">
  <div class="page-head">
    <div>
      <div class="crumbs"><a th:href="@{/api/admin/tables}">테이블 목록</a> / <span th:text="${list.tableName}">table</span></div>
      <h1 th:text="${list.tableName}">table</h1>
    </div>
  </div>

  <section class="panel">
    <form class="toolbar" method="get" th:action="@{/api/admin/tables/{tableName}(tableName=${list.tableName})}">
      <th:block th:if="${!list.packageOptions.empty}">
        <label class="muted" for="package-filter">Package</label>
        <select id="package-filter" class="select select-bordered select-sm" name="handover-package-id">
          <option value="">전체</option>
          <option th:each="option : ${list.packageOptions}" th:value="${option.id}" th:text="${option.label}"
                  th:selected="${option.id == list.selectedPackageId}">Package</option>
        </select>
        <button class="btn btn-sm" type="submit">적용</button>
      </th:block>
      <span class="spacer"></span>
      <span class="muted" th:text="|총 ${list.totalElements}건 · 최신순 · ${list.pageSize()}건씩|">총 0건</span>
    </form>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr><th th:each="column : ${list.columns}" th:text="${column}">column</th></tr>
        </thead>
        <tbody>
          <tr class="hover" th:each="row : ${list.rows}" style="cursor:pointer"
              th:onclick="|location.href='@{/api/admin/tables/{tableName}/{id}(tableName=${list.tableName},id=${row.id})}'|">
            <td th:each="cell : ${row.cells}">
              <th:block th:if="${cell.empty}"><span class="muted">-</span></th:block>
              <th:block th:unless="${cell.empty}">
                <a class="fk" th:if="${cell.hasLink()}"
                   th:href="@{/api/admin/tables/{tableName}/{id}(tableName=${cell.linkTableName},id=${cell.linkId})}"
                   th:text="${cell.text}">0f3a9c21</a>
                <span class="badge badge-soft" th:if="${!cell.hasLink() and cell.badge != null}" th:text="${cell.badge}">BADGE</span>
                <span th:if="${!cell.hasLink() and cell.badge == null}" th:text="${cell.text}">값</span>
              </th:block>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pager">
      <span class="muted" th:text="|${list.firstRowNumber()} - ${list.lastRowNumber()} / ${list.totalElements}|">0 - 0 / 0</span>
      <div class="join">
        <a class="btn btn-sm join-item" th:if="${list.hasPrevious()}"
           th:href="@{/api/admin/tables/{tableName}(tableName=${list.tableName},page=${list.page - 1},'handover-package-id'=${list.selectedPackageId})}">이전</a>
        <button class="btn btn-sm join-item" th:unless="${list.hasPrevious()}" disabled>이전</button>
        <a class="btn btn-sm join-item" th:if="${list.hasNext()}"
           th:href="@{/api/admin/tables/{tableName}(tableName=${list.tableName},page=${list.page + 1},'handover-package-id'=${list.selectedPackageId})}">다음</a>
        <button class="btn btn-sm join-item" th:unless="${list.hasNext()}" disabled>다음</button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
